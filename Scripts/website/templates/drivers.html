{% extends 'base.html' %}

{% block content %}
    <div class="d-flex m-3" style="flex-direction:column; align-items:center;">
        <div class="d-flex mt-1 mb-2"><h1>Racer Rankings ({{ year }})</h1></div>
        <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Pos.</th>
                <th>Name</th>
                <th>Total Points</th>
                <th>Team</th>
            </tr>
        </thead>
        <tbody class="table-light">
            {% for ranking in rankings %}
            <tr>
                <th>{{ ranking.position }}</th>
                <th>{{ ranking.driver.name }}</th>
                <th>{{ ranking.points }}</th>
                <th>{{ ranking.driver.team.name }}</th>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    </div>
{% endblock %}
