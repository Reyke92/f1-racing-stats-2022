{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>F1 Racing Stats</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="{% static 'css/styles.css' %}" type="text/css"/>
        {% block headStuff %}{% endblock %}
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">F1 Racing Stats</a>
                <div class="d-flex ms-auto">
                <span class="navbar-text me-2" style="color:white;">View Rankings By:</span>
                <a href="{% url 'races' %}"><span class="navbar-text me-2" style="color:white;">Race</span></a>
                <a href="{% url 'drivers' %}"><span class="navbar-text me-2" style="color:white;">Driver</span></a>
                <a href="{% url 'teams' %}"><span class="navbar-text ms-2" style="color:white;">Team</span></a>
                </div>
            </div>
        </nav>
        {% block content %}{% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.min.js" integrity="sha384-IDwe1+LCz02ROU9k972gdyvl+AESN10+x7tBKgc9I5HFtuNz0wWnPclzo6p9vxnk" crossorigin="anonymous"></script>
    </body>
</html>
